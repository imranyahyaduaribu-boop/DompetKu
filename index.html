function headerTitle(){const map={dashboard:'Beranda',transaksi:'Transaksi',anggaran:'Anggaran',tujuan:'Tujuan Keuangan',rekening:'Rekening',laporan:'Laporan Keuangan',kalender:'Kalender',berulang:'Transaksi Berulang',kategori:'Kategori',notifikasi:'Notifikasi',profil:'Profil',pengaturan:'Pengaturan'};return map[state.page]||'DompetKu'}
function navItem(page,ic,label){return `<button class="${state.page===page?'active':''}" onclick="setPage('${page}')">${svg(ic,17)}<span>${label}</span></button>`}
function shell(content){const unread=state.notifications.filter(n=>!n.read).length;return `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">D</div><div><strong>DompetKu</strong><span>Demo • Personal Finance</span></div></div><div class="nav">${navItem('dashboard','home','Beranda')}${navItem('transaksi','receipt','Transaksi')}${navItem('anggaran','pie','Anggaran')}${navItem('tujuan','target','Tujuan')}${navItem('rekening','wallet','Rekening')}${navItem('laporan','pie','Laporan')}${navItem('kalender','calendar','Kalender')}${navItem('berulang','repeat','Transaksi Berulang')}${navItem('kategori','tag','Kategori')}${navItem('notifikasi','bell','Notifikasi')}${navItem('profil','user','Profil')}${navItem('pengaturan','settings','Pengaturan')}</div><div class="side-bottom"><div class="profile-mini"><div class="avatar">IY</div><div><b>${esc(state.profile.name)}</b><small>Mode demo</small></div></div></div></aside><div class="main"><header class="topbar"><div class="topbar-left"><button class="icon-btn mobile-menu" onclick="openPalette()">${svg('menu',17)}</button><div class="page-title">${headerTitle()}</div></div><div class="top-actions"><button class="btn soft optional" onclick="openPalette()">${svg('search',15)}Cari <span class="kbd">Ctrl K</span></button>${iconBtn(state.theme==='dark'?'sun':'moon', 'Tema', 'icon-btn', 'toggleTheme()')}<button class="icon-btn" onclick="setPage('notifikasi')">${svg('bell',17)}${unread?'<i class="badge-dot"></i>':''}</button><button class="icon-btn optional" onclick="setPage('profil')">${svg('user',17)}</button></div></header>${content}<nav class="mobile-bottom"><button class="${state.page==='dashboard'?'active':''}" onclick="setPage('dashboard')">${svg('home',18)}<span>Beranda</span></button><button class="${state.page==='transaksi'?'active':''}" onclick="setPage('transaksi')">${svg('receipt',18)}<span>Transaksi</span></button><button class="add" onclick="openTxModal()">${svg('plus',22)}</button><button class="${state.page==='anggaran'?'active':''}" onclick="setPage('anggaran')">${svg('pie',18)}<span>Anggaran</span></button><button class="${state.page==='profil'?'active':''}" onclick="setPage('profil')">${svg('user',18)}<span>Profil</span></button></nav></div></div>`}
function dashboard(){const t=totals();const cats={};monthTx().filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const max=Math.max(...Object.values(cats),1);const insights=[];if(t.expense>t.income)insights.push('Pengeluaran periode ini melebihi pemasukan.');if(topCats[0]&&topCats[0][1]>t.expense*.3)insights.push(`${topCats[0][0]} menjadi kategori pengeluaran terbesar bulan ini.`);if(t.income&&pct(t.net,t.income)>=20)insights.push('Tingkat menabung bulan ini berada di atas 20%.');if(!insights.length)insights.push('Belum ada pola yang perlu diperhatikan. Terus catat transaksi secara konsisten.');return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Minggu, 27 September 2026</div><div class="h1">Selamat datang, ${esc(state.profile.name)}.</div><p class="sub">Pantau kondisi keuanganmu hari ini.</p></div><div class="actions"><button class="btn primary" onclick="openTxModal()">${svg('plus',16)}Tambah Transaksi</button><button class="btn" onclick="openTransferModal()">Transfer</button><button class="btn optional" onclick="setPage('laporan')">Laporan</button></div></div><div class="grid summary-grid"><div class="card metric"><div class="metric-top"><span>Saldo Total</span><div class="metric-icon">${svg('wallet',17)}</div></div><div class="metric-value">${money(t.balance)}</div><div class="metric-foot up">↑ 7,4% dari bulan lalu</div></div><div class="card metric"><div class="metric-top"><span>Pemasukan Bulan Ini</span><div class="metric-icon">${svg('arrow',17)}</div></div><div class="metric-value">${money(t.income)}</div><div class="metric-foot up">↑ 4,8% vs periode lalu</div></div><div class="card metric"><div class="metric-top"><span>Pengeluaran Bulan Ini</span><div class="metric-icon">${svg('receipt',17)}</div></div><div class="metric-value">${money(t.expense)}</div><div class="metric-foot down">↓ 2,1% vs periode lalu</div></div><div class="card metric"><div class="metric-top"><span>Sisa Bulan Ini</span><div class="metric-icon">${svg('target',17)}</div></div><div class="metric-value">${money(t.net)}</div><div class="metric-foot">Net cash flow September</div></div></div><div class="grid chart-grid" style="margin-top:16px"><div class="card"><div class="card-head"><div><div class="card-title">Arus Kas</div><div class="card-sub">Pemasukan dan pengeluaran harian bulan ini.</div></div><button class="btn soft" onclick="setPage('laporan')">Lihat laporan</button></div><div class="card-body"><div class="chart">${cashflowSvg()}</div><div class="legend"><div class="legend-row"><i class="dot" style="background:#10b981"></i>Pemasukan</div><div class="legend-row"><i class="dot" style="background:#f43f5e"></i>Pengeluaran</div></div></div></div><div class="card"><div class="card-head"><div><div class="card-title">Pengeluaran per Kategori</div><div class="card-sub">Ke mana uangmu pergi bulan ini.</div></div></div><div class="card-body"><div class="donut-wrap"><div class="donut"></div><div class="donut-center"><b>${money(t.expense)}</b><span>Total pengeluaran</span></div></div><div class="list">${topCats.slice(0,5).map(([n,v])=>`<div class="row" style="padding-left:0;padding-right:0"><div class="row-icon">${svg('tag',16)}</div><div class="row-main"><b>${esc(n)}</b><span>${money(v)}</span></div><div class="amount">${pct(v,t.expense)}%</div></div>`).join('')}</div></div></div></div><div class="grid split" style="margin-top:16px"><div class="card"><div class="card-head"><div><div class="card-title">Anggaran Bulan Ini</div><div class="card-sub">Pantau pemakaian budget kategori penting.</div></div><button class="btn soft" onclick="setPage('anggaran')">Kelola</button></div><div>${state.budgets.map(b=>{const spent=monthTx().filter(x=>x.type==='expense'&&x.category===b.name).reduce((a,x)=>a+x.amount,0);return `<div class="budget-item"><div class="budget-meta"><div><b>${esc(b.name)}</b><span>${money(spent)} / ${money(b.amount)}</span></div><b>${pct(spent,b.amount)}%</b></div><div class="progress" style="margin-top:9px"><i style="width:${Math.min(pct(spent,b.amount),100)}%"></i></div></div>`}).join('')}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Target Keuangan</div><div class="card-sub">Sedikit demi sedikit menuju tujuan.</div></div><button class="btn soft" onclick="setPage('tujuan')">Lihat semua</button></div><div class="list">${state.goals.map(g=>`<div class="row"><div class="row-icon">${svg('target',16)}</div><div class="row-main"><b>${esc(g.name)}</b><span>${money(g.current)} / ${money(g.target)}</span></div><div class="amount">${pct(g.current,g.target)}%</div></div>`).join('')}</div></div></div><div class="grid chart-grid" style="margin-top:16px"><div class="card"><div class="card-head"><div><div class="card-title">Transaksi Terbaru</div><div class="card-sub">Aktivitas keuangan terakhir.</div></div><button class="btn soft" onclick="setPage('transaksi')">Semua</button></div><div class="list">${state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(txRow).join('')}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Insight Keuangan</div><div class="card-sub">Berdasarkan data demo yang aktif.</div></div>${svg('spark',19)}</div><div class="card-body">${insights.map(x=>`<div class="insight" style="margin-bottom:10px">${esc(x)}</div>`).join('')}<div class="card" style="padding:14px;margin-top:8px;background:var(--surface-2);box-shadow:none"><span style="font-size:10px;color:var(--muted)">Savings rate</span><div style="font-size:22px;font-weight:900;margin-top:4px">${t.income?pct(t.net,t.income):0}%</div><div style="font-size:9px;color:var(--muted);margin-top:3px">Metrik informasional, bukan nasihat keuangan profesional.</div></div></div></div></div></main>`)}
function txRow(t){return `<div class="row"><div class="row-icon">${svg(t.type==='income'?'arrow':'receipt',16)}</div><div class="row-main"><b>${esc(t.desc)}</b><span>${esc(t.category)} • ${esc(t.account)} • ${dateId(t.date)}</span></div><div class="amount ${t.type==='income'?'up':'down'}">${t.type==='income'?'+':'-'}${money(t.amount)}</div></div>`}
function cashflowSvg(){const days=30, vals=Array.from({length:days},(_,i)=>{const d=`2026-09-${String(i+1).padStart(2,'0')}`;const day=state.transactions.filter(t=>t.date===d);return [day.filter(t=>t.type==='income').reduce((a,x)=>a+x.amount,0),day.filter(t=>t.type==='expense').reduce((a,x)=>a+x.amount,0)]});const ymax=Math.max(...vals.flat(),500000);const path=(idx,color)=>{let p='';vals.forEach((v,i)=>{const x=2+i*(96/(days-1));const y=92-(v[idx]/ymax)*78;p+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' '});return `<path d="${p}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round"/>`};return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><g opacity=".16" stroke="currentColor"><path d="M2 18H98M2 43H98M2 68H98M2 93H98"/></g>${path(0,'#10b981')}${path(1,'#f43f5e')}<g fill="currentColor" opacity=".55" font-size="4"><text x="2" y="99">1</text><text x="31" y="99">10</text><text x="63" y="99">20</text><text x="93" y="99">30</text></g></svg>`}
function transactionsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Aktivitas keuangan</div><div class="h1">Transaksi</div><p class="sub">Cari, filter, dan kelola semua transaksi kamu.</p></div><div class="actions"><button class="btn" onclick="openTransferModal()">${svg('arrow',16)}Transfer</button><button class="btn primary" onclick="openTxModal()">${svg('plus',16)}Tambah Transaksi</button></div></div><div class="card"><div class="filterbar"><div class="fields"><input id="q" class="input search-field" placeholder="Cari makan, gaji, BCA..." oninput="renderTxTable()" /><select id="typeFilter" class="select" onchange="renderTxTable()"><option value="">Semua tipe</option><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select><select id="catFilter" class="select" onchange="renderTxTable()"><option value="">Semua kategori</option>${state.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="accFilter" class="select" onchange="renderTxTable()"><option value="">Semua rekening</option>${state.accounts.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select><button class="btn soft" onclick="resetTxFilters()">Reset</button></div></div><div id="txTable"></div></div></main>`)}
function renderTxTable(){const q=(document.getElementById('q')?.value||'').toLowerCase(),ty=document.getElementById('typeFilter')?.value||'',ca=document.getElementById('catFilter')?.value||'',ac=document.getElementById('accFilter')?.value||'';const rows=state.transactions.filter(t=>(!q||(`${t.desc} ${t.note} ${t.category} ${t.account}`).toLowerCase().includes(q))&&(!ty||t.type===ty)&&(!ca||t.category===ca)&&(!ac||t.account===ac)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('txTable').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Rekening</th><th>Tipe</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${dateId(t.date)}</td><td><b>${esc(t.desc)}</b></td><td>${esc(t.category)}</td><td>${esc(t.account)}</td><td><span class="pill ${t.type==='income'?'green':'red'}">${t.type==='income'?'Pemasukan':'Pengeluaran'}</span></td><td class="${t.type==='income'?'up':'down'}"><b>${t.type==='income'?'+':'-'}${money(t.amount)}</b></td><td><button class="icon-btn" onclick="editTx('${t.id}')">${svg('edit',14)}</button> <button class="icon-btn" onclick="deleteTx('${t.id}')">${svg('trash',14)}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${svg('receipt',26)}<b>Belum ada transaksi yang sesuai.</b><p>Coba ubah filter atau catat transaksi baru.</p><button class="btn primary" onclick="openTxModal()">Tambah transaksi</button></div>`}
function resetTxFilters(){['q','typeFilter','catFilter','accFilter'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});renderTxTable()}
function accountsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Pusat uangmu</div><div class="h1">Rekening</div><p class="sub">Kelola saldo tunai, bank, dan dompet digital.</p></div><button class="btn primary" onclick="openAccountModal()">${svg('plus',16)}Tambah Rekening</button></div><div class="card pad" style="margin-bottom:16px"><div class="eyebrow">Total Saldo</div><div class="h1" style="margin-top:6px">${money(totals().balance)}</div><p class="sub">Saldo gabungan semua rekening aktif di mode demo.</p></div><div class="grid account-grid">${state.accounts.map(a=>`<div class="card account-card"><div class="account-head"><div class="row-icon">${svg(a.type==='Bank'?'wallet':'wallet',17)}</div><span class="pill blue">${esc(a.type)}</span></div><div class="account-balance">${money(a.balance)}</div><div style="font-size:12px;font-weight:900">${esc(a.name)}</div><div style="font-size:10px;color:var(--muted);margin-top:3px">${esc(a.institution||'')}</div><div class="actions" style="margin-top:13px"><button class="btn soft" onclick="editAccount('${a.id}')">Edit</button></div></div>`).join('')}</div></main>`)}
function budgetsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Atur pengeluaran</div><div class="h1">Anggaran</div><p class="sub">Tetapkan batas pengeluaran dan pantau pemakaiannya.</p></div><button class="btn primary" onclick="openBudgetModal()">${svg('plus',16)}Tambah Anggaran</button></div><div class="grid stat-row" style="margin-bottom:16px"><div class="card mini"><span>Total Anggaran</span><b>${money(state.budgets.reduce((a,b)=>a+b.amount,0))}</b></div><div class="card mini"><span>Total Terpakai</span><b>${money(state.budgets.reduce((a,b)=>a+monthTx().filter(t=>t.category===b.name&&t.type==='expense').reduce((x,y)=>x+y.amount,0),0))}</b></div><div class="card mini"><span>Sisa</span><b>${money(state.budgets.reduce((a,b)=>a+b.amount,0)-state.budgets.reduce((a,b)=>a+monthTx().filter(t=>t.category===b.name&&t.type==='expense').reduce((x,y)=>x+y.amount,0),0))}</b></div><div class="card mini"><span>Utilisasi</span><b>${pct(state.budgets.reduce((a,b)=>a+monthTx().filter(t=>t.category===b.name&&t.type==='expense').reduce((x,y)=>x+y.amount,0),0),state.budgets.reduce((a,b)=>a+b.amount,0))}%</b></div></div><div class="card">${state.budgets.map(b=>{const spent=monthTx().filter(t=>t.category===b.name&&t.type==='expense').reduce((a,x)=>a+x.amount,0);const p=pct(spent,b.amount);const st=p>=100?'red':p>=85?'amber':'green';return `<div class="budget-item"><div class="budget-meta"><div><b>${esc(b.name)}</b><span>${money(spent)} / ${money(b.amount)}</span></div><span class="pill ${st}">${p>=100?'Melebihi':p>=85?'Hampir habis':'Aman'} • ${p}%</span></div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(p,100)}%"></i></div><div class="actions" style="margin-top:10px"><button class="btn soft" onclick="editBudget('${b.id}')">Edit</button><button class="btn danger" onclick="deleteBudget('${b.id}')">Hapus</button></div></div>`}).join('')}</div></main>`)}
function goalsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Rencanakan masa depan</div><div class="h1">Tujuan Keuangan</div><p class="sub">Bangun target dengan progress yang mudah dipantau.</p></div><button class="btn primary" onclick="openGoalModal()">${svg('plus',16)}Tambah Target</button></div><div class="grid goal-grid">${state.goals.map(g=>{const p=Math.min(pct(g.current,g.target),100);const remain=Math.max(g.target-g.current,0);return `<div class="card goal"><div class="goal-top"><div class="goal-icon">${svg('target',18)}</div><span class="pill green">${p}%</span></div><div style="font-size:15px;font-weight:900;margin-top:15px">${esc(g.name)}</div><div class="sub" style="margin-top:4px">Target ${money(g.target)}</div><div class="progress" style="margin-top:16px"><i style="width:${p}%"></i></div><div style="display:flex;justify-content:space-between;font-size:10px;margin-top:8px"><span>${money(g.current)} terkumpul</span><b>${money(remain)} lagi</b></div><div class="sub" style="margin-top:8px">Deadline ${dateId(g.deadline)}</div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="contributeGoal('${g.id}')">Tambah Dana</button><button class="btn soft" onclick="editGoal('${g.id}')">Edit</button></div></div>`}).join('')}</div></main>`)}
function reportsPage(){const t=totals();const top=Object.entries(state.transactions.filter(x=>x.type==='expense').reduce((m,x)=>(m[x.category]=(m[x.category]||0)+x.amount,m),{})).sort((a,b)=>b[1]-a[1]);return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Memahami kondisi keuangan</div><div class="h1">Laporan Keuangan</div><p class="sub">Ringkasan September 2026 dari data demo yang aktif.</p></div><div class="actions"><button class="btn" onclick="downloadCSV()">${svg('download',15)}CSV</button><button class="btn primary" onclick="window.print()">Cetak / PDF</button></div></div><div class="grid stat-row" style="margin-bottom:16px"><div class="card mini"><span>Total Pemasukan</span><b class="up">${money(t.income)}</b></div><div class="card mini"><span>Total Pengeluaran</span><b class="down">${money(t.expense)}</b></div><div class="card mini"><span>Net Cash Flow</span><b>${money(t.net)}</b></div><div class="card mini"><span>Savings Rate</span><b>${t.income?pct(t.net,t.income):0}%</b></div></div><div class="grid split"><div class="card"><div class="card-head"><div><div class="card-title">Tren Arus Kas</div><div class="card-sub">Perbandingan pemasukan dan pengeluaran.</div></div></div><div class="card-body"><div class="chart">${cashflowSvg()}</div></div></div><div class="card"><div class="card-head"><div><div class="card-title">Pengeluaran per Kategori</div><div class="card-sub">Urutan kategori berdasarkan nilai pengeluaran.</div></div></div><div class="list">${top.map(([k,v])=>`<div class="row"><div class="row-icon">${svg('tag',16)}</div><div class="row-main"><b>${esc(k)}</b><span>${money(v)}</span></div><div class="amount">${pct(v,t.expense)}%</div></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><div><div class="card-title">Kesehatan Keuangan</div><div class="card-sub">Metrik informasional untuk membantu memahami pola keuangan.</div></div></div><div class="card-body"><div class="grid stat-row"><div class="card mini" style="background:var(--surface-2);box-shadow:none"><span>Savings Rate</span><b>${t.income?pct(t.net,t.income):0}%</b></div><div class="card mini" style="background:var(--surface-2);box-shadow:none"><span>Expense Ratio</span><b>${t.income?pct(t.expense,t.income):0}%</b></div><div class="card mini" style="background:var(--surface-2);box-shadow:none"><span>Budget Usage</span><b>${pct(state.budgets.reduce((a,b)=>a+monthTx().filter(t=>t.category===b.name&&t.type==='expense').reduce((x,y)=>x+y.amount,0),0),state.budgets.reduce((a,b)=>a+b.amount,0))}%</b></div><div class="card mini" style="background:var(--surface-2);box-shadow:none"><span>Monthly Net Cash Flow</span><b>${money(t.net)}</b></div></div></div></div></main>`)}
function calendarPage(){const days=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];let cells='';const first=new Date('2026-09-01T00:00:00').getDay();for(let i=0;i<42;i++){const num=i-first+1;if(num<1||num>30){cells+=`<div class="day muted"></div>`;continue}const d=`2026-09-${String(num).padStart(2,'0')}`;const tx=state.transactions.filter(t=>t.date===d);cells+=`<div class="day"><b>${num}</b>${tx.slice(0,2).map(t=>`<div class="day-event ${t.type}">${t.type==='income'?'+':'-'} ${esc(t.desc)} ${money(t.amount)}</div>`).join('')}</div>`}return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">September 2026</div><div class="h1">Kalender Keuangan</div><p class="sub">Lihat pemasukan dan pengeluaran berdasarkan tanggal.</p></div><button class="btn primary" onclick="openTxModal()">${svg('plus',16)}Tambah Transaksi</button></div><div class="card pad"><div class="calendar">${days.map(d=>`<div class="cal-head">${d}</div>`).join('')}${cells}</div></div></main>`)}
function recurringPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Otomatisasi jadwal</div><div class="h1">Transaksi Berulang</div><p class="sub">Kelola pemasukan dan tagihan yang berulang.</p></div><button class="btn primary" onclick="openRecurringModal()">${svg('plus',16)}Tambah Jadwal</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Deskripsi</th><th>Tipe</th><th>Nominal</th><th>Rekening</th><th>Frekuensi</th><th>Jatuh tempo</th><th>Aksi</th></tr></thead><tbody>${state.recurring.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="pill ${r.type==='income'?'green':'red'}">${r.type==='income'?'Pemasukan':'Pengeluaran'}</span></td><td>${money(r.amount)}</td><td>${esc(r.account)}</td><td>${esc(r.frequency)}</td><td>${dateId(r.next)}</td><td><button class="icon-btn" onclick="editRecurring('${r.id}')">${svg('edit',14)}</button><button class="icon-btn" onclick="deleteRecurring('${r.id}')">${svg('trash',14)}</button></td></tr>`).join('')}</tbody></table></div></main>`)}
function categoriesPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Klasifikasi transaksi</div><div class="h1">Kategori</div><p class="sub">Atur kategori agar laporan keuangan lebih mudah dipahami.</p></div><button class="btn primary" onclick="openCategoryModal()">${svg('plus',16)}Tambah Kategori</button></div><div class="grid split"><div class="card"><div class="card-head"><div class="card-title">Pengeluaran</div></div><div class="list">${state.categories.filter(c=>c.type==='expense').map(c=>`<div class="row"><div class="row-icon">${svg('tag',16)}</div><div class="row-main"><b>${esc(c.name)}</b><span>Kategori pengeluaran</span></div><button class="icon-btn" onclick="deleteCategory('${c.name}')">${svg('trash',14)}</button></div>`).join('')}</div></div><div class="card"><div class="card-head"><div class="card-title">Pemasukan</div></div><div class="list">${state.categories.filter(c=>c.type==='income').map(c=>`<div class="row"><div class="row-icon">${svg('tag',16)}</div><div class="row-main"><b>${esc(c.name)}</b><span>Kategori pemasukan</span></div><button class="icon-btn" onclick="deleteCategory('${c.name}')">${svg('trash',14)}</button></div>`).join('')}</div></div></div></main>`)}
function notificationsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Pusat perhatian</div><div class="h1">Notifikasi</div><p class="sub">Pengingat dan insight yang membantu kamu tetap teratur.</p></div><button class="btn" onclick="markAllRead()">Tandai semua dibaca</button></div><div class="card list">${state.notifications.map(n=>`<div class="row" style="padding:16px 18px;${n.read?'':'background:rgba(16,185,129,.04)'}"><div class="row-icon">${svg(n.type==='warning'?'bell':n.type==='success'?'check':'spark',17)}</div><div class="row-main"><b>${esc(n.title)}</b><span>${esc(n.message)} • ${esc(n.date)}</span></div>${!n.read?`<button class="btn soft" onclick="markRead('${n.id}')">Baca</button>`:''}</div>`).join('')}</div></main>`)}
function profilePage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Identitas akun demo</div><div class="h1">Profil</div><p class="sub">Informasi dasar yang digunakan di aplikasi.</p></div></div><div class="card pad" style="max-width:700px"><div class="form-grid"><div class="field full"><span class="label">Nama lengkap</span><input id="profileName" class="input" value="${esc(state.profile.name)}"></div><div class="field full"><span class="label">Email</span><input class="input" value="${esc(state.profile.email)}" readonly></div><div><span class="label">Mata uang</span><input class="input" value="IDR — Rupiah Indonesia" readonly></div><div><span class="label">Timezone</span><input class="input" value="Asia/Jakarta" readonly></div></div><button class="btn primary" style="margin-top:16px" onclick="saveProfile()">Simpan perubahan</button></div></main>`)}
function settingsPage(){return shell(`<main class="container"><div class="page-head"><div><div class="eyebrow">Preferensi</div><div class="h1">Pengaturan</div><p class="sub">Sesuaikan pengalaman DompetKu sesuai kebutuhanmu.</p></div></div><div class="grid split"><div class="card pad"><div class="card-title">Appearance</div><p class="sub" style="margin-top:6px">Tema yang nyaman untuk dipakai setiap hari.</p><div class="actions" style="margin-top:14px"><button class="btn ${state.theme==='light'?'primary':''}" onclick="setTheme('light')">Light</button><button class="btn ${state.theme==='dark'?'primary':''}" onclick="setTheme('dark')">Dark</button><button class="btn ${state.theme==='system'?'primary':''}" onclick="setTheme('system')">System</button></div></div><div class="card pad"><div class="card-title">Notifikasi</div><p class="sub" style="margin-top:6px">Demo menggunakan notifikasi internal berbasis data lokal.</p><label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:12px"><input type="checkbox" checked> Budget alerts</label><label style="display:flex;gap:9px;align-items:center;margin-top:9px;font-size:12px"><input type="checkbox" checked> Goal reminders</label></div><div class="card pad"><div class="card-title">Data</div><p class="sub" style="margin-top:6px">Semua data demo disimpan di browser perangkat ini.</p><div class="actions" style="margin-top:14px"><button class="btn" onclick="downloadBackup()">${svg('download',15)}Backup JSON</button><button class="btn danger" onclick="resetDemo()">Reset Demo</button></div></div><div class="card pad"><div class="card-title">Mode Demo</div><p class="sub" style="margin-top:6px">Tidak ada login sungguhan dan tidak ada data Supabase. Cocok untuk presentasi, UI review, dan uji alur.</p><div class="insight" style="margin-top:14px">Versi produksi di ZIP Full-Stack tetap menjadi basis untuk authentication, PostgreSQL, Supabase RLS, storage, dan API.</div></div></div></main>`)}
function openModal(title,body){const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';bg.innerHTML=`<div class="modal"><div class="modal-head"><b>${title}</b><button class="icon-btn" onclick="closeModal()">${svg('x',16)}</button></div><div class="modal-body">${body}</div></div>`;bg.addEventListener('click',e=>{if(e.target===bg)closeModal()});document.body.appendChild(bg)}function closeModal(){document.getElementById('modal')?.remove()}
function openTxModal(edit){const tx=edit?state.transactions.find(t=>t.id===edit):null;const t=tx||{type:'expense',amount:0,desc:'',category:'Makanan',account:state.accounts[0].name,date:'2026-09-27',note:''};openModal(edit?'Edit Transaksi':'Tambah Transaksi',`<form onsubmit="saveTx(event,'${edit||''}')"><div class="type-toggle"><button type="button" class="${t.type==='expense'?'active expense':''}" onclick="setTxType(this,'expense')">Pengeluaran</button><button type="button" class="${t.type==='income'?'active income':''}" onclick="setTxType(this,'income')">Pemasukan</button><button type="button" class="${t.type==='transfer'?'active transfer':''}" onclick="closeModal();openTransferModal()">Transfer</button></div><input type="hidden" id="txType" value="${t.type}"><div class="form-grid" style="margin-top:16px"><div class="field full"><span class="label">Nominal</span><input id="txAmount" class="input" inputmode="numeric" value="${t.amount}" required></div><div class="field full"><span class="label">Deskripsi</span><input id="txDesc" class="input" value="${esc(t.desc)}" placeholder="Makan siang / Gaji / Tagihan" required></div><div><span class="label">Kategori</span><select id="txCat" class="select">${state.categories.map(c=>`<option ${c.name===t.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><span class="label">Rekening</span><select id="txAcc" class="select">${state.accounts.map(a=>`<option ${a.name===t.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><span class="label">Tanggal</span><input id="txDate" type="date" class="input" value="${t.date}"></div><div><span class="label">Catatan</span><input id="txNote" class="input" value="${esc(t.note||'')}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Transaksi</button></div></form>`)}
function setTxType(btn,type){document.querySelectorAll('.type-toggle button').forEach(b=>b.className='');btn.classList.add('active',type);document.getElementById('txType').value=type}
function applyBalance(accountName,delta){const a=state.accounts.find(x=>x.name===accountName);if(a)a.balance+=delta}
function saveTx(e,id){e.preventDefault();const type=document.getElementById('txType').value,amount=Number(document.getElementById('txAmount').value.replace(/[^0-9]/g,''));if(!amount||amount<=0)return toast('Nominal harus lebih dari 0.');const desc=document.getElementById('txDesc').value.trim();const category=document.getElementById('txCat').value;const account=document.getElementById('txAcc').value;const date=document.getElementById('txDate').value;const note=document.getElementById('txNote').value.trim();if(type==='transfer')return openTransferModal();if(id){const old=state.transactions.find(t=>t.id===id);if(!old)return;if(old.type==='income')applyBalance(old.account,-old.amount);if(old.type==='expense')applyBalance(old.account,old.amount);Object.assign(old,{type,amount,desc,category,account,date,note});if(type==='income')applyBalance(account,amount);if(type==='expense')applyBalance(account,-amount);toast('Transaksi berhasil diperbarui.')}else{state.transactions.push({id:'t'+Date.now(),type,amount,desc,category,account,date,note});if(type==='income')applyBalance(account,amount);if(type==='expense')applyBalance(account,-amount);toast('Transaksi berhasil disimpan.')}save();closeModal();render()}
function editTx(id){openTxModal(id)}function deleteTx(id){if(!confirm('Hapus transaksi ini?'))return;const old=state.transactions.find(t=>t.id===id);if(old){if(old.type==='income')applyBalance(old.account,-old.amount);if(old.type==='expense')applyBalance(old.account,old.amount)}state.transactions=state.transactions.filter(t=>t.id!==id);save();toast('Transaksi berhasil dihapus.');render()}
function openTransferModal(){openModal('Transfer Antar Rekening',`<form onsubmit="saveTransfer(event)"><div class="form-grid"><div><span class="label">Dari</span><select id="trFrom" class="select">${state.accounts.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></div><div><span class="label">Ke</span><select id="trTo" class="select">${state.accounts.map((a,i)=>`<option ${i===1?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><span class="label">Nominal</span><input id="trAmount" class="input" inputmode="numeric" value="200000"></div><div><span class="label">Tanggal</span><input id="trDate" type="date" class="input" value="2026-09-27"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Transfer sekarang</button></div></form>`)}
function saveTransfer(e){e.preventDefault();const f=document.getElementById('trFrom').value,to=document.getElementById('trTo').value,amount=Number(document.getElementById('trAmount').value.replace(/[^0-9]/g,''));if(f===to||!amount)return toast('Pilih dua rekening berbeda dan nominal valid.');const fa=state.accounts.find(a=>a.name===f),ta=state.accounts.find(a=>a.name===to);if(!fa||!ta)return;if(fa.balance<amount)return toast('Saldo rekening asal tidak mencukupi.');fa.balance-=amount;ta.balance+=amount;state.transactions.push({id:'t'+Date.now(),type:'expense',amount,desc:`Transfer ke ${to}`,category:'Lainnya',account:f,date:document.getElementById('trDate').value,note:'Transfer antar rekening demo'});save();closeModal();toast('Transfer berhasil diproses.');render()}
function openAccountModal(edit){const a=edit?state.accounts.find(x=>x.id===edit):null;openModal(edit?'Edit Rekening':'Tambah Rekening',`<form onsubmit="saveAccount(event,'${edit||''}')"><div class="form-grid"><div class="field full"><span class="label">Nama rekening</span><input id="acName" class="input" value="${esc(a?.name||'')}" required></div><div><span class="label">Jenis</span><select id="acType" class="select">${['Bank','Cash','E-Wallet','Credit Card','Other'].map(x=>`<option ${x===(a?.type||'Bank')?'selected':''}>${x}</option>`).join('')}</select></div><div><span class="label">Institusi</span><input id="acIns" class="input" value="${esc(a?.institution||'')}"></div><div><span class="label">Saldo</span><input id="acBal" class="input" inputmode="numeric" value="${a?.balance||0}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveAccount(e,id){e.preventDefault();const name=document.getElementById('acName').value.trim(),type=document.getElementById('acType').value,ins=document.getElementById('acIns').value.trim(),bal=Number(document.getElementById('acBal').value.replace(/[^0-9]/g,''));if(id){Object.assign(state.accounts.find(a=>a.id===id),{name,type,institution:ins,balance:bal});toast('Rekening diperbarui.')}else{state.accounts.push({id:'a'+Date.now(),name,type,institution:ins,balance:bal});toast('Rekening berhasil ditambahkan.')}save();closeModal();render()}
function editAccount(id){openAccountModal(id)}
function openBudgetModal(edit){const b=edit?state.budgets.find(x=>x.id===edit):null;openModal(edit?'Edit Anggaran':'Tambah Anggaran',`<form onsubmit="saveBudget(event,'${edit||''}')"><div class="field"><span class="label">Kategori</span><select id="buName" class="select">${state.categories.filter(c=>c.type==='expense').map(c=>`<option ${c.name===(b?.name||'Makanan')?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div style="margin-top:14px"><span class="label">Batas anggaran</span><input id="buAmount" class="input" inputmode="numeric" value="${b?.amount||1500000}"></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveBudget(e,id){e.preventDefault();const name=document.getElementById('buName').value,amount=Number(document.getElementById('buAmount').value.replace(/[^0-9]/g,''));if(!amount)return toast('Nominal budget tidak valid.');if(id)Object.assign(state.budgets.find(b=>b.id===id),{name,amount});else state.budgets.push({id:'b'+Date.now(),name,amount});save();closeModal();toast('Anggaran tersimpan.');render()}
function editBudget(id){openBudgetModal(id)}function deleteBudget(id){if(!confirm('Hapus anggaran ini?'))return;state.budgets=state.budgets.filter(b=>b.id!==id);save();render()}
function openGoalModal(edit){const g=edit?state.goals.find(x=>x.id===edit):null;openModal(edit?'Edit Target':'Tambah Target',`<form onsubmit="saveGoal(event,'${edit||''}')"><div class="form-grid"><div class="field full"><span class="label">Nama target</span><input id="goName" class="input" value="${esc(g?.name||'')}" placeholder="Dana darurat" required></div><div><span class="label">Target amount</span><input id="goTarget" class="input" inputmode="numeric" value="${g?.target||10000000}"></div><div><span class="label">Sudah terkumpul</span><input id="goCurrent" class="input" inputmode="numeric" value="${g?.current||0}"></div><div><span class="label">Deadline</span><input id="goDate" type="date" class="input" value="${g?.deadline||'2027-03-31'}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveGoal(e,id){e.preventDefault();const name=document.getElementById('goName').value.trim(),target=Number(document.getElementById('goTarget').value.replace(/[^0-9]/g,'')),current=Number(document.getElementById('goCurrent').value.replace(/[^0-9]/g,'')),deadline=document.getElementById('goDate').value;if(!name||!target)return toast('Target belum lengkap.');if(id)Object.assign(state.goals.find(g=>g.id===id),{name,target,current,deadline});else state.goals.push({id:'g'+Date.now(),name,target,current,deadline});save();closeModal();toast('Target tersimpan.');render()}
function editGoal(id){openGoalModal(id)}function contributeGoal(id){openModal('Tambah Dana ke Target',`<form onsubmit="saveContribution(event,'${id}')"><span class="label">Nominal kontribusi</span><input id="conAmount" class="input" inputmode="numeric" value="500000"><p class="sub" style="margin-top:7px">Demo akan menambahkan dana ke progress target dan mengurangi saldo BCA.</p><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Tambah Dana</button></div></form>`)}
function saveContribution(e,id){e.preventDefault();const a=Number(document.getElementById('conAmount').value.replace(/[^0-9]/g,'')),g=state.goals.find(x=>x.id===id),acc=state.accounts.find(a=>a.name==='BCA');if(!a||!g)return;if(acc.balance<a)return toast('Saldo BCA tidak mencukupi.');acc.balance-=a;g.current=Math.min(g.target,g.current+a);save();closeModal();toast('Kontribusi target berhasil.');render()}
function openCategoryModal(){openModal('Kategori Baru',`<form onsubmit="saveCategory(event)"><div><span class="label">Nama</span><input id="caName" class="input" required></div><div style="margin-top:14px"><span class="label">Tipe</span><select id="caType" class="select"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveCategory(e){e.preventDefault();const name=document.getElementById('caName').value.trim(),type=document.getElementById('caType').value;if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Kategori sudah ada.');state.categories.push({id:'c'+Date.now(),name,type});save();closeModal();toast('Kategori berhasil ditambahkan.');render()}
function deleteCategory(name){if(state.transactions.some(t=>t.category===name))return toast('Kategori ini masih digunakan transaksi demo.');state.categories=state.categories.filter(c=>c.name!==name);save();toast('Kategori dihapus.');render()}
function openRecurringModal(edit){const r=edit?state.recurring.find(x=>x.id===edit):null;openModal(edit?'Edit Jadwal':'Tambah Transaksi Berulang',`<form onsubmit="saveRecurring(event,'${edit||''}')"><div class="form-grid"><div class="field full"><span class="label">Deskripsi</span><input id="rrName" class="input" value="${esc(r?.name||'')}" required></div><div><span class="label">Tipe</span><select id="rrType" class="select"><option value="expense" ${r?.type==='expense'?'selected':''}>Pengeluaran</option><option value="income" ${r?.type==='income'?'selected':''}>Pemasukan</option></select></div><div><span class="label">Nominal</span><input id="rrAmt" class="input" inputmode="numeric" value="${r?.amount||0}"></div><div><span class="label">Rekening</span><select id="rrAcc" class="select">${state.accounts.map(a=>`<option ${a.name===(r?.account||state.accounts[0].name)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><span class="label">Frekuensi</span><select id="rrFreq" class="select">${['Harian','Mingguan','Bulanan','Triwulanan','Tahunan'].map(x=>`<option ${x===(r?.frequency||'Bulanan')?'selected':''}>${x}</option>`).join('')}</select></div><div><span class="label">Jatuh tempo</span><input id="rrNext" type="date" class="input" value="${r?.next||'2026-10-25'}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveRecurring(e,id){e.preventDefault();const obj={name:document.getElementById('rrName').value.trim(),type:document.getElementById('rrType').value,amount:Number(document.getElementById('rrAmt').value.replace(/[^0-9]/g,'')),account:document.getElementById('rrAcc').value,category:'Lainnya',frequency:document.getElementById('rrFreq').value,next:document.getElementById('rrNext').value};if(!obj.name||!obj.amount)return toast('Lengkapi jadwal.');if(id)Object.assign(state.recurring.find(r=>r.id===id),obj);else state.recurring.push({id:'r'+Date.now(),...obj});save();closeModal();toast('Jadwal tersimpan.');render()}
function editRecurring(id){openRecurringModal(id)}function deleteRecurring(id){if(!confirm('Hapus jadwal ini?'))return;state.recurring=state.recurring.filter(r=>r.id!==id);save();toast('Jadwal dihapus.');render()}
function markRead(id){const n=state.notifications.find(n=>n.id===id);if(n)n.read=true;save();render()}function markAllRead(){state.notifications.forEach(n=>n.read=true);save();render();toast('Semua notifikasi ditandai dibaca.')}
function saveProfile(){state.profile.name=document.getElementById('profileName').value.trim()||'Pengguna';save();toast('Profil berhasil diperbarui.');render()}
function toggleTheme(){setTheme(state.theme==='dark'?'light':'dark')}function setTheme(t){state.theme=t;document.documentElement.setAttribute('data-theme',t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t);save();if(document.getElementById('modal'))render()}function openPalette(){const p=document.getElementById('palette');p.style.display='flex';document.getElementById('paletteInput').focus()}function closePalette(){document.getElementById('palette').style.display='none'}
function downloadCSV(){const head='Tanggal,Deskripsi,Kategori,Rekening,Tipe,Nominal\n';const body=state.transactions.map(t=>`${t.date},"${t.desc.replace(/"/g,'""')}","${t.category}","${t.account}",${t.type},${t.amount}`).join('\n');const blob=new Blob([head+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dompetku-demo-transaksi.csv';a.click();URL.revokeObjectURL(a.href)}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dompetku-demo-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(!confirm('Reset semua data demo ke kondisi awal?'))return;state=structuredClone(seed);save();toast('Data demo direset.');render()}
function dateId(d){return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function render(){document.documentElement.setAttribute('data-theme',state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme);let content='';switch(state.page){case'dashboard':content=dashboard();break;case'transaksi':content=transactionsPage();break;case'anggaran':content=budgetsPage();break;case'tujuan':content=goalsPage();break;case'rekening':content=accountsPage();break;case'laporan':content=reportsPage();break;case'kalender':content=calendarPage();break;case'berulang':content=recurringPage();break;case'kategori':content=categoriesPage();break;case'notifikasi':content=notificationsPage();break;case'profil':content=profilePage();break;case'pengaturan':content=settingsPage();break;default:content=dashboard()}document.getElementById('root').innerHTML=content+`<div id="palette" class="search-palette"><div class="palette"><input id="paletteInput" placeholder="Cari menu atau aksi..." oninput="paletteFilter(this.value)"><div class="palette-items" id="paletteItems"></div></div></div>`;paletteFilter('');if(state.page==='transaksi')renderTxTable()}
const paletteItems=[['dashboard','Buka dashboard'],['transaksi','Buka transaksi'],['anggaran','Buka anggaran'],['tujuan','Buka target keuangan'],['rekening','Buka rekening'],['laporan','Buka laporan'],['kalender','Buka kalender'],['berulang','Buka transaksi berulang'],['kategori','Buka kategori'],['notifikasi','Buka notifikasi'],['profil','Buka profil'],['pengaturan','Buka pengaturan'],['__add','Tambah transaksi']];function paletteFilter(q){const el=document.getElementById('paletteItems');if(!el)return;const arr=paletteItems.filter(x=>x[1].toLowerCase().includes((q||'').toLowerCase()));el.innerHTML=arr.map(x=>`<button onclick="${x[0]==='__add'?'closePalette();openTxModal()':'closePalette();setPage(\''+x[0]+'\')'}"><span>${x[1]}</span><span class="kbd">Enter</span></button>`).join('')}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'){closePalette();closeModal()}});
render();
</script>
</body>
</html>
